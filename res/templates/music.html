<header>
    <img class="cover" src="{{ music.recenttracks.track[0].image[2]['#text']}}">
    <a class="button secondary" href="{{ music.recenttracks.track[0].url}}">{{ icons.link }}</a>
</header>
{% if music.recenttracks.track[0].name|length > 18 %}
    <div class="marquee">
        <div>
            <span class="name">{{ music.recenttracks.track[0].name }} •</span>
            <span class="name">{{ music.recenttracks.track[0].name }} •</span>
        </div>
    </div>
{% else %}
    <span class="name">{{ music.recenttracks.track[0].name }}</span>
{% endif %}
<span class="artist">{{ music.recenttracks.track[0].artist['#text'] }}</span>
